<div id="newsletter-modal" class="newsletter-modal">
  <div class="newsletter-modal-content">
    <span class="newsletter-close">&times;</span>
    <div class="newsletter-header">
      <h2>Stay Updated!</h2>
      <p>Join the Physics Voyage newsletter to get the latest articles and courses delivered straight to your inbox.</p>
    </div>
    <form id="newsletter-form">
      <input type="email" id="newsletter-email" name="Email" placeholder="Your email address" required />
      <button type="submit" id="newsletter-submit">Subscribe</button>
    </form>
    <div id="newsletter-message" style="display: none; margin-top: 15px; font-weight: bold;"></div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const modal = document.getElementById("newsletter-modal");
  const closeBtn = document.querySelector(".newsletter-close");
  const form = document.getElementById("newsletter-form");
  const messageDiv = document.getElementById("newsletter-message");
  
  // Check if user already dismissed or subscribed
  if (!localStorage.getItem("newsletterDismissed")) {
    // Show after 5 seconds
    setTimeout(() => {
      modal.classList.add("show");
    }, 5000);
  }

  const closeModal = () => {
    modal.classList.remove("show");
    localStorage.setItem("newsletterDismissed", "true");
  };

  closeBtn.addEventListener("click", closeModal);

  // Close when clicking outside
  window.addEventListener("click", (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("newsletter-email").value;
    const submitBtn = document.getElementById("newsletter-submit");
    
    submitBtn.textContent = "Subscribing...";
    submitBtn.disabled = true;

    // Google Apps Script Web App URL
    const scriptURL = "https://script.google.com/macros/s/AKfycbznnRrkbY3P0rTduyWB28U_8F_8auH1T2pu7yG_PCODFH3DSWpnGQgl5NpMcVuA1LQN/exec";
    
    const formData = new FormData();
    formData.append("Email", email);

    fetch(scriptURL, { method: "POST", body: formData })
      .then(response => response.json())
      .then(data => {
        if (data.result === "success") {
          form.style.display = "none";
          messageDiv.style.display = "block";
          messageDiv.textContent = "Thank you for subscribing!";
          messageDiv.style.color = "#2e7d32";
          localStorage.setItem("newsletterDismissed", "true");
          setTimeout(() => {
            modal.classList.remove("show");
          }, 3000);
        } else {
          throw new Error("Submission failed");
        }
      })
      .catch(error => {
        console.error("Error!", error.message);
        messageDiv.style.display = "block";
        messageDiv.textContent = "Oops! Something went wrong. Please try again.";
        messageDiv.style.color = "#d32f2f";
        submitBtn.textContent = "Subscribe";
        submitBtn.disabled = false;
      });
  });
});
</script>
