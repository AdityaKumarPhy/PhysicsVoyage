<!-- Back to Top Button -->
<button id="back-to-top" class="back-to-top" aria-label="Back to top">
  <i class="bi bi-chevron-up"></i>
</button>

<style>
/* Back to top button styling */
.back-to-top {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 45px;
  height: 45px;
  background-color: var(--bs-body-bg, #fff);
  color: var(--bs-body-color, #212529);
  border: 2px solid var(--bs-body-color, #212529);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  cursor: pointer;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  box-shadow: 2px 2px 0px var(--bs-body-color, #212529);
}

.back-to-top.show {
  opacity: 1;
  visibility: visible;
}

.back-to-top:hover {
  transform: scale(1.1) translateY(-3px);
  background-color: var(--bs-body-color, #212529);
  color: var(--bs-body-bg, #fff);
  box-shadow: 3px 4px 0px var(--bs-body-color, #212529);
}

.back-to-top:active {
  transform: scale(0.95) translateY(0);
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const backToTopBtn = document.getElementById("back-to-top");
  
  if (backToTopBtn) {
    // Show or hide button based on scroll position
    window.addEventListener("scroll", function() {
      if (window.scrollY > 300) {
        backToTopBtn.classList.add("show");
      } else {
        backToTopBtn.classList.remove("show");
      }
    });

    // Smooth scroll to top when clicked
    backToTopBtn.addEventListener("click", function() {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  }
});
</script>
