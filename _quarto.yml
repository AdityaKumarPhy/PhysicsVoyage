project:
  type: website
  output-dir: docs
  pre-render: python3 fetch_youtube.py
  resources:
    - youtube-data.json

website:
  title: "Physics Voyage"
  search: true
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: blog.qmd
        text: Blog          
      - href: courses.qmd
        text: Course 
      - href: project.qmd
        text: Projects
      - href: about.qmd
        text: About
  reader-mode: true
  sidebar:
    - contents: posts.qmd # Creates a blog listing sidebar
      title: Recent Posts
  page-footer:
    center: "© 2026 Physics Voyage"

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: sketchy
      dark: [sketchy, sketchy-dark.scss]
    highlight-style:
      light: github
      dark: dracula
    css: styles.css
    toc: true
    include-after-body:
      - newsletter-popup.html
      - back-to-top.html
