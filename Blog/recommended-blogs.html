<style>
.recommended-blogs-wrapper {
  margin-top: 4rem;
  padding: 1.5rem 2rem;
  border-radius: 12px;
  background: linear-gradient(145deg, rgba(76, 114, 176, 0.05) 0%, rgba(85, 168, 104, 0.05) 100%);
  border-left: 4px solid #4C72B0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  display: none; /* hidden until loaded */
  transition: all 0.3s ease;
}
.recommended-blogs-wrapper:hover {
  box-shadow: 0 6px 25px rgba(0,0,0,0.04);
}
.recommended-blogs-title {
  margin-top: 0;
  margin-bottom: 1rem;
  color: #4C72B0;
  font-size: 1.15rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}
.recommended-blogs-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.recommended-blog-item a {
  text-decoration: none;
  color: var(--bs-body-color, #333);
  font-weight: 500;
  font-size: 1.05rem;
  display: block;
  padding: 8px 12px;
  border-radius: 6px;
  transition: all 0.2s;
  background: rgba(255,255,255,0.4);
}
.dark-mode .recommended-blog-item a {
  color: var(--bs-body-color, #ddd);
  background: rgba(255,255,255,0.03);
}
.recommended-blog-item a:hover {
  background: rgba(76, 114, 176, 0.1);
  color: #4C72B0;
  transform: translateX(5px);
}
.dark-mode .recommended-blogs-wrapper {
  background: linear-gradient(145deg, rgba(76, 114, 176, 0.1) 0%, rgba(85, 168, 104, 0.1) 100%);
}
</style>

<div id="recommended-blogs" class="recommended-blogs-wrapper">
  <h3 class="recommended-blogs-title">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/></svg>
    Read Next
  </h3>
  <ul id="recommended-blogs-list" class="recommended-blogs-list">
  </ul>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  // Only run if we are inside a blog post
  if (!window.location.pathname.includes('/Blog/') || window.location.pathname.endsWith('/index.html')) {
    return;
  }

  // Identify root URL dynamically
  const searchScript = document.querySelector('script[src*="quarto-search.js"]');
  let rootUrl = "/";
  if (searchScript) {
    const src = searchScript.getAttribute("src");
    if (src) {
      rootUrl = src.split('site_libs')[0];
    }
  }

  fetch(rootUrl + 'search.json')
    .then(response => response.json())
    .then(data => {
      const currentPath = window.location.pathname;
      const blogPosts = new Map();
      let currentPostText = "";

      // Gather unique posts
      data.forEach(item => {
        if (item.href && item.href.startsWith('Blog/') && item.section === "") {
          if (currentPath.endsWith("/" + item.href) || currentPath.endsWith(item.href)) {
            currentPostText = item.text || "";
          } else {
            blogPosts.set(item.href, item);
          }
        }
      });

      let uniquePosts = Array.from(blogPosts.values());
      
      if (uniquePosts.length > 0) {
        // Simple word overlap similarity for categories/topics
        const getWords = (str) => new Set(str.toLowerCase().match(/\b[a-z]{4,}\b/g) || []);
        const currentWords = getWords(currentPostText);

        uniquePosts.forEach(post => {
          const postWords = getWords(post.text || "");
          let overlap = 0;
          postWords.forEach(word => { if (currentWords.has(word)) overlap++; });
          // Add a tiny random factor so ties are broken unpredictably
          post.similarityScore = overlap + Math.random();
        });

        // Sort by similarity and take top 3
        uniquePosts.sort((a, b) => b.similarityScore - a.similarityScore);
        const selected = uniquePosts.slice(0, 3);
        
        const listContainer = document.getElementById('recommended-blogs-list');
        selected.forEach(post => {
          const li = document.createElement('li');
          li.className = 'recommended-blog-item';
          const a = document.createElement('a');
          
          a.href = rootUrl + post.href;
          a.textContent = post.title;
          
          li.appendChild(a);
          listContainer.appendChild(li);
        });
        
        // Show the widget
        const isDarkMode = document.body.classList.contains('quarto-dark') || document.documentElement.classList.contains('quarto-dark') || document.body.dataset.quartoTheme === 'dark';
        const wrapper = document.getElementById('recommended-blogs');
        if(isDarkMode) wrapper.classList.add('dark-mode');
        wrapper.style.display = 'block';

        // Listen for Quarto theme toggle
        window.document.addEventListener('quarto-color-scheme-toggle', function(e) {
            if (e.detail.colorScheme === 'dark') {
                wrapper.classList.add('dark-mode');
            } else {
                wrapper.classList.remove('dark-mode');
            }
        });
      }
    })
    .catch(err => console.error("Error loading recommended blogs:", err));
});
</script>
